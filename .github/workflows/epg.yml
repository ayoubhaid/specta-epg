name: Build Specta EPG

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: specta-epg-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  build:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Specta EPG
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check private inventory configuration
        env:
          INVENTORY_REPO: ${{ secrets.SPECTA_INVENTORY_REPO }}
          INVENTORY_TOKEN: ${{ secrets.SPECTA_INVENTORY_TOKEN }}
        run: |
          if [ -z "$INVENTORY_REPO" ] || [ -z "$INVENTORY_TOKEN" ]; then
            echo "::error::Configure SPECTA_INVENTORY_REPO and SPECTA_INVENTORY_TOKEN secrets for the private Specta channel inventory."
            exit 1
          fi

      - name: Checkout private Specta inventory
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SPECTA_INVENTORY_REPO }}
          token: ${{ secrets.SPECTA_INVENTORY_TOKEN }}
          path: private-inventory
          persist-credentials: false

      - name: Discover beIN provider channel IDs
        run: |
          mkdir -p build
          python scripts/run_epg.py discover --provider bein_mena --output build/bein-provider-catalog.json

      - name: Build curated EPG feeds
        env:
          SPECTA_INVENTORY_PATH: private-inventory/channels.xml
          BEIN_REGION: en-mena
          EPG_DAYS: "5"
          REQUEST_DELAY_MS: "500"
        run: |
          python scripts/run_epg.py build \
            --inventory "$SPECTA_INVENTORY_PATH" \
            --mapping config/channel-mapping.json \
            --output-dir public \
            --days "$EPG_DAYS"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specta-epg-build-diagnostics
          path: |
            build/
            public/coverage.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
